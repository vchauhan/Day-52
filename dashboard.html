<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — GCC Fit Assessor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230b1220'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%2338bdf8' font-family='sans-serif' font-weight='800'%3EG%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <h1>Leads Dashboard</h1>
    <p class="muted">Founder-only view. Not linked from the public site.</p>

    <div class="card fade-in" id="passcode-gate">
      <label class="field-label" for="passcode-input">Passcode</label>
      <input type="password" id="passcode-input" placeholder="Enter passcode" autocomplete="off" />
      <button id="passcode-submit">Enter</button>
    </div>

    <div class="card fade-in" id="leads-container" style="display:none;" aria-live="polite">
      <p class="muted">No leads yet.</p>
    </div>
  </main>
  <footer class="site-footer">Built with Claude as part of the AB Talks 60-Day Claude AI Challenge.</footer>

  <script src="js/config.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
